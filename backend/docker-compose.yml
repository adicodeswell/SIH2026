version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: mahasetu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  mock-systems:
    build:
      context: ./mock-systems
    ports:
      - "8091:8091"

  interoperability-service:
    build:
      context: ./interoperability-service
    ports:
      - "8082:8082"
    depends_on:
      - mock-systems

  application-service:
    build:
      context: ./application-service
    environment:
      DB_HOST: postgres
      KEYCLOAK_URL: http://keycloak:8080
      WORKFLOW_SERVICE_URL: http://security-workflow-service:8083
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  security-workflow-service:
    build:
      context: ./security-workflow-service
    environment:
      DB_HOST: postgres
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/mahasetu
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/mahasetu/protocol/openid-connect/token
      APPLICATION_SERVICE_URL: http://application-service:8081
      INTEROPERABILITY_SERVICE_URL: http://interoperability-service:8082
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
