spring:
  application:
    name: security-workflow-service-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/mahasetu
      client:
        registration:
          security-workflow-service:
            provider: keycloak
            authorization-grant-type: client_credentials
            client-id: test-client
            client-secret: test-secret
        provider:
          keycloak:
            token-uri: http://localhost:8080/realms/mahasetu/protocol/openid-connect/token

camunda:
  bpm:
    auto-deployment-enabled: true
    database:
      schema-update: true
    job-execution:
      enabled: false
    history-level: full

mahasetu:
  application-service:
    url: http://localhost:8081
  interoperability-service:
    url: http://localhost:8082
    token: MAHASETU_SUPER_SECRET_TOKEN_2026
  consent-policy:
    policies:
      SKILL_BENEFIT:
        dataScope: "education,employment,skills"
        purpose: "verification"
        requestingDepartmentId: "DEPT-SKILLS"
        requiredFields: "fullName,dateOfBirth,highestDegree,employmentStatus,skillStatus"
        optionalFields: "annualFamilyIncome"
      SCHOLARSHIP:
        dataScope: "education"
        purpose: "scholarship_verification"
        requestingDepartmentId: "DEPT-EDU"
        requiredFields: "fullName,dateOfBirth,highestDegree,universityName"
        optionalFields: "annualFamilyIncome"
      SRV-EDU:
        dataScope: "education"
        purpose: "verification"
        requestingDepartmentId: "DEPT-EDU"
        requiredFields: "fullName,dateOfBirth,highestDegree,universityName"
        optionalFields: "annualFamilyIncome"
