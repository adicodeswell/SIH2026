server:
  port: 8081

spring:
  application:
    name: application-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mahasetu}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:mahasetu}
      client:
        registration:
          application-service:
            provider: keycloak
            authorization-grant-type: client_credentials
            client-id: ${APPLICATION_SERVICE_CLIENT_ID:application-service}
            client-secret: ${APPLICATION_SERVICE_CLIENT_SECRET:}
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:mahasetu}/protocol/openid-connect/token

integration:
  workflow-service:
    url: ${WORKFLOW_SERVICE_URL:http://localhost:8083}
    registration-id: application-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
