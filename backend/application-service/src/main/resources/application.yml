server:
  port: 8081

spring:
  application:
    name: application-service
  datasource:
    url: ${APP_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:ep-proud-tree-a5mvkwlf-pooler.us-east-2.aws.neon.tech}:${DB_PORT:5432}/${DB_NAME:mahasetu_application}?sslmode=require}}
    username: ${APP_DB_USER:${DB_USER:neondb_owner}}
    password: ${APP_DB_PASSWORD:${DB_PASSWORD:npg_n7J6NReErVwU}}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/${KEYCLOAK_REALM:mahasetu}
          jwk-set-uri: http://keycloak:8080/realms/${KEYCLOAK_REALM:mahasetu}/protocol/openid-connect/certs
      client:
        registration:
          application-service:
            provider: keycloak
            authorization-grant-type: client_credentials
            client-id: ${APPLICATION_SERVICE_CLIENT_ID:application-service}
            client-secret: ${APPLICATION_SERVICE_CLIENT_SECRET:}
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:mahasetu}/protocol/openid-connect/token

integration:
  workflow-service:
    url: ${WORKFLOW_SERVICE_URL:http://localhost:8083}
    registration-id: application-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
