server:
  port: 8082

spring:
  application:
    name: interoperability-service
  cache:
    cache-names: citizenData
    caffeine:
      spec: expireAfterWrite=10m,maximumSize=1000

resilience4j:
  circuitbreaker:
    instances:
      externalService:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        permittedNumberOfCallsInHalfOpenState: 2
        waitDurationInOpenState: 10s
        failureRateThreshold: 50

mahasetu:
  interoperability:
    token: ${INTEROPERABILITY_SERVICE_TOKEN:MAHASETU_SUPER_SECRET_TOKEN_2026}
