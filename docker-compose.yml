services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mahasetu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mahasetu"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: ${KEYCLOAK_DB_URL:-jdbc:postgresql://ep-proud-tree-a5mvkwlf-pooler.us-east-2.aws.neon.tech:5432/mahasetu_keycloak?sslmode=require}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-neondb_owner}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-npg_n7J6NReErVwU}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT_BACKCHANNEL: "true"
    volumes:
      - ./infrastructure/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "8080:8080"

  mock-systems:
    build:
      context: .
      dockerfile: backend/mock-systems/Dockerfile
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "8091:8091"

  interoperability-service:
    build:
      context: .
      dockerfile: backend/interoperability-service/Dockerfile
    environment:
      INTEROPERABILITY_SERVICE_TOKEN: ${INTEROPERABILITY_SERVICE_TOKEN:-dev-interop-token}
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "8082:8082"
    depends_on:
      - mock-systems

  application-service:
    build:
      context: .
      dockerfile: backend/application-service/docker/Dockerfile
    environment:
      APP_DB_URL: ${APP_DB_URL:-jdbc:postgresql://ep-proud-tree-a5mvkwlf-pooler.us-east-2.aws.neon.tech:5432/mahasetu_application?sslmode=require}
      APP_DB_USER: ${APP_DB_USER:-neondb_owner}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-npg_n7J6NReErVwU}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: mahasetu
      WORKFLOW_SERVICE_URL: http://security-workflow-service:8083
      APPLICATION_SERVICE_CLIENT_ID: application-service
      APPLICATION_SERVICE_CLIENT_SECRET: ${APPLICATION_SERVICE_CLIENT_SECRET:-dev-application-service-secret}
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "8081:8081"
    depends_on:
      keycloak:
        condition: service_started

  security-workflow-service:
    build:
      context: .
      dockerfile: backend/security-workflow-service/Dockerfile
    environment:
      WORKFLOW_DB_URL: ${WORKFLOW_DB_URL:-jdbc:postgresql://ep-proud-tree-a5mvkwlf-pooler.us-east-2.aws.neon.tech:5432/mahasetu_workflow?sslmode=require}
      WORKFLOW_DB_USER: ${WORKFLOW_DB_USER:-neondb_owner}
      WORKFLOW_DB_PASSWORD: ${WORKFLOW_DB_PASSWORD:-npg_n7J6NReErVwU}
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/mahasetu
      KEYCLOAK_TOKEN_URI: http://localhost:8080/realms/mahasetu/protocol/openid-connect/token
      APPLICATION_SERVICE_URL: http://application-service:8081
      INTEROPERABILITY_SERVICE_URL: http://interoperability-service:8082
      INTEROPERABILITY_SERVICE_TOKEN: ${INTEROPERABILITY_SERVICE_TOKEN:-dev-interop-token}
      SECURITY_WORKFLOW_CLIENT_ID: security-workflow-service
      SECURITY_WORKFLOW_CLIENT_SECRET: ${SECURITY_WORKFLOW_CLIENT_SECRET:-dev-security-workflow-secret}
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "8083:8083"
    depends_on:
      keycloak:
        condition: service_started
      application-service:
        condition: service_started
      interoperability-service:
        condition: service_started

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "3000:80"
